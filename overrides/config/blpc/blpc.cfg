# Configuration file

general {

    claims {
        # When true, party claim limit = sum of each member's individual limit.
        B:"Additive Party Limits"=true

        # Keep force-loaded chunks active even when all party members are offline.
        B:"Allow Offline Chunk Loading"=true

        # Dimension IDs where chunk claiming is not allowed (e.g. 1 for The End).
        I:"Blocked Claiming Dimensions" <
         >

        # Maximum chunks a player can claim.
        # Min: 0
        # Max: 10000
        I:"Max Claims Per Player"=1000

        # Maximum chunks a player can force load.
        # Min: 0
        # Max: 10000
        I:"Max Force Loads Per Player"=64
    }

    party {
        # Automatically create a party named after the player in singleplayer.
        B:"Auto Create Party (Singleplayer)"=true
    }

    serverparty {
        # Automatically create a shared party on server start.
        B:Enable=false

        # Enable free-to-join (auto-join) on the server party.
        B:"Free to Join"=true

        # Player names to assign as moderators (ADMIN role).
        S:Moderators <
         >

        # Player name who owns the server party. Leave empty for server-owned.
        S:Owner=

        # Name for the auto-created server party.
        S:"Party Name"=Server
    }

    data {
        # Merge chunk data when switching between offline and online mode.
        B:"Merge Offline/Online Data"=true
    }

    protection {
        # Blocks that bypass edit protection (registry names, e.g. 'minecraft:wooden_door').
        S:"Block Edit Whitelist" <
         >

        # Blocks that bypass interact protection (e.g. 'minecraft:crafting_table').
        S:"Block Interact Whitelist" <
         >

        # Items always blocked in claimed chunks regardless of trust (e.g. 'minecraft:bucket').
        S:"Item Use Blacklist" <
         >
    }

    fairplay {
        # Apply potion effects for area control: weakness/mining fatigue to enemies inside a claim, resistance/strength to defenders while enemies are present. Disable for PvP servers where this home-field advantage would be considered unfair.
        B:"Enable Area Effects"=true

        # Send toast notifications when entering or leaving a claimed chunk: relation-aware wording for members/allies/enemies of the claim, or a plain owner-name toast for unrelated players passing through. This is also the only on-screen indicator of claim protection, so you always know whether you're currently protected during PvP.
        B:"Enable Transit Notifications"=true
    }

}


